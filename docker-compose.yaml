version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: jobstream-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: jobstream
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobstream"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: