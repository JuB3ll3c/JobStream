openapi: 3.1.0
info:
  title: JobStream API
  version: 1.0.0
  description: |
    REST API for searching and managing job offers.
    Shared contracts between Backend (Spring Boot) and Frontend (Angular).
    
    **API-First approach**: This file is the source of truth.
    DTOs and clients are generated automatically from this spec.
servers:
  - url: http://localhost:8080/api
    description: Development server

# ============================================================================
# PATHS - Endpoints RESTful
# ============================================================================
paths:
  # --------------------------------------------------------------------------
  # Auth
  # --------------------------------------------------------------------------
  /auth/register:
    post:
      tags:
        - Authentication
      summary: User registration
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User created and authenticate with success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Data not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User connection
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentification réussie, retourne le token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Identifiants invalides (email ou mot de passe incorrect)


  # --------------------------------------------------------------------------
  # Jobs - External search (Adzuna)
  # --------------------------------------------------------------------------
  /adzuna/jobs:
    get:
      summary: Search for job offers
      operationId: searchJobs
      tags:
        - Adzuna
      parameters:
        - name: query
          in: query
          required: true
          description: Search keyword
          schema:
            type: string
            minLength: 1
            maxLength: 200
            pattern: "^.*\\S.*$"
          example: "java developer paris"
        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            default: 1
            minimum: 1
            example: 1
        - name: limit
          in: query
          required: false
          description: Number of results per page
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
            example: 20
        - name: location
          in: query
          required: false
          description: Search location
          schema:
            type: string
            pattern: "^[a-zA-Z\\s\\-.,]+$"
            example: "paris"
      responses:
        '200':
          description: List of found jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdzunaJobSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /adzuna/jobs/{externalId}:
    get:
      summary: Get an external job detail
      operationId: getAdzunaJobById
      tags:
        - Adzuna
      parameters:
        - name: externalId
          in: path
          required: true
          description: External job ID (Adzuna)
          schema:
            type: string
          example: "job_123456"
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDto'
        '404':
          $ref: '#/components/responses/NotFound'
  /jobs/{id}:
    get:
      summary: Get a saved job detail
      operationId: getJobById
      tags:
        - Job
      parameters:
        - name: id
          in: path
          required: true
          description: Internal ID of the saved job
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Saved job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDto'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete a saved job
      operationId: deleteJob
      tags:
        - Job
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the job to delete
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Job deleted
        '404':
          $ref: '#/components/responses/NotFound'
  /jobs:
    get:
      summary: List saved jobs
      operationId: getJobs
      tags:
        - Job
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (zero-based)
          schema:
            type: integer
            default: 0
            minimum: 0
            example: 0
        - name: size
          in: query
          required: false
          description: Number of results per page
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
            example: 20
        - name: sort
          in: query
          required: false
          description: Sort criteria, e.g. "createdAt,desc"
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Paginated list of saved jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedJobResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      summary: Save a job
      operationId: saveJob
      tags:
        - Job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequestDto'
      responses:
        '201':
          description: Job saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
# ============================================================================
# COMPONENTS - Schemas & Responses
# ============================================================================
components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required:
        - accessToken
        - tokenType
      properties:
        accessToken:
          type: string
          description: Token JWT Bearer à transmettre dans le header Authorization
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          example: Bearer

    JobRequestDto:
      type: object
      description: Job found via the external API (to be saved)
      required:
        - externalId
        - title
        - company
        - location
      properties:
        externalId:
          type: string
          description: External ID (Adzuna)
          example: "job_123456"
        title:
          type: string
          example: "Senior Java Developer"
        company:
          type: string
          example: "TechCorp France"
        location:
          type: string
          example: "Paris, France"
        description:
          type: string
          description: Full job description
          example: "We are looking for an experienced Java developer..."
        salaryMin:
          type: integer
          description: Minimum salary
          example: 50000
        salaryMax:
          type: integer
          description: Maximum salary
          example: 80000
        contractType:
          type: string
          description: Contract type
          example: "CDI"
        postedDate:
          type: string
          format: date
          description: Publication date
          example: "2026-03-20"
        jobUrl:
          type: string
          description: Original job URL
          example: "https://example.com/job/123"
        requirements:
          type: array
          items:
            type: string
          description: List of requirements
          example: ["Java 17", "Spring Boot", "PostgreSQL"]
    JobDto:
      description: Saved job
      allOf:
        - $ref: '#/components/schemas/JobRequestDto'
        - type: object
          properties:
            id:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
              description: Creation date
            updatedAt:
              type: string
              format: date-time
              description: Last update
    PagedJobResponse:
      type: object
      description: Paginated response for saved jobs
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/JobDto'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    # ----------------------------------------------------------------------
    # Response DTOs
    # ----------------------------------------------------------------------
    AdzunaJobSearchResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobDto'
        total:
          type: integer
          description: Total number of results
          example: 150
        count:
          type: integer
          description: Number of returned results
          example: 15

    # ----------------------------------------------------------------------
    # Error DTOs
    # ----------------------------------------------------------------------
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
          example: "Job not found"
        message:
          type: string
          example: "Job not found"
        date:
          type: string
          format: date-time

  # ----------------------------------------------------------------------
  # Responses
  # ----------------------------------------------------------------------
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "BAD_REQUEST"
            message: "Invalid parameters"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "NOT_FOUND"
            message: "Job not found"

    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "CONFLICT"
            message: "Job already saved"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: "INTERNAL_ERROR"
            message: "An unexpected error occurred"
