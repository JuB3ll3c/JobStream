openapi: 3.1.0
info:
  title: JobStream API
  version: 1.0.0
  description: |
    REST API for searching and managing job offers.
    Shared contracts between Backend (Spring Boot) and Frontend (Angular).
    
    **API-First approach**: This file is the source of truth.
    DTOs and clients are generated automatically from this spec.
servers:
  - url: http://localhost:8080/api
    description: Development server

security:
  - bearerAuth: []

# ============================================================================
# PATHS - Endpoints RESTful
# ============================================================================
paths:
  # --------------------------------------------------------------------------
  # Auth
  # --------------------------------------------------------------------------
  /auth/register:
    post:
      tags:
        - Authentication
      summary: User registration
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User created and authenticate with success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Data not valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User connection
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentification réussie, retourne le token JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'


  # --------------------------------------------------------------------------
  # Jobs - Provider-independent external search
  # --------------------------------------------------------------------------
  /job-offers:
    get:
      summary: Search external job offers
      description: Search by keywords and location without provider-specific parameters.
      operationId: searchJobOffers
      tags:
        - JobOffer
      parameters:
        - name: title
          in: query
          required: true
          description: Job title or keywords; matching may be approximate.
          schema:
            type: string
            minLength: 1
            maxLength: 200
            pattern: "^.*\\S.*$"
          example: "Java Developer"
        - name: location
          in: query
          required: false
          description: Location keywords. Omit to search without a location restriction.
          schema:
            type: string
            minLength: 1
            maxLength: 200
            pattern: "^.*\\S.*$"
          example: "Zurich"
        - name: page
          in: query
          required: false
          description: Page number, starting at 1.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: size
          in: query
          required: false
          description: Maximum number of results per page.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated job offers, including an empty page when no results match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOfferSearchResponse'
              examples:
                empty:
                  summary: No matching offers
                  value:
                    content: []
                    page: 1
                    size: 20
                    totalElements: 0
                    totalPages: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: External search provider unavailable. No provider-specific error details are exposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 503
                error: "Service Unavailable"
                message: "Job search is temporarily unavailable"

  # --------------------------------------------------------------------------
  # Jobs - External search (Adzuna)
  # --------------------------------------------------------------------------
  /adzuna/jobs/{externalId}:
    get:
      summary: Get an external job detail
      operationId: getAdzunaJobById
      tags:
        - Adzuna
      parameters:
        - name: externalId
          in: path
          required: true
          description: External job ID (Adzuna)
          schema:
            type: string
          example: "job_123456"
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /jobs/{id}:
    get:
      summary: Get a saved job detail
      description: Returns only an offer owned by the authenticated user. Missing offers and offers owned by another user both return 404.
      operationId: getJobById
      x-spring-provide-args:
        - '@org.springframework.security.core.annotation.AuthenticationPrincipal com.jobstream.api.entity.User user'
      tags:
        - Job
      parameters:
        - name: id
          in: path
          required: true
          description: Internal ID of the saved job
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Saved job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      summary: Delete a saved job
      description: Deletes only an offer owned by the authenticated user. Missing offers and offers owned by another user both return 404.
      operationId: deleteJob
      x-spring-provide-args:
        - '@org.springframework.security.core.annotation.AuthenticationPrincipal com.jobstream.api.entity.User user'
      tags:
        - Job
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the job to delete
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Job deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /jobs:
    get:
      summary: List saved jobs
      description: Lists only offers owned by the authenticated user. Pagination totals refer to that user's collection.
      operationId: getJobs
      x-spring-provide-args:
        - '@org.springframework.security.core.annotation.AuthenticationPrincipal com.jobstream.api.entity.User user'
      tags:
        - Job
      parameters:
        - name: page
          in: query
          required: false
          description: Page number (zero-based)
          schema:
            type: integer
            default: 0
            minimum: 0
            example: 0
        - name: size
          in: query
          required: false
          description: Number of results per page
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
            example: 20
        - name: sort
          in: query
          required: false
          description: Sort criteria, e.g. "createdAt,desc"
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Paginated list of saved jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedJobResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Save a job
      description: The owner is taken from the authentication context, never from the request body. A duplicate externalId within that user's collection returns 409; different users may save the same external offer.
      operationId: saveJob
      x-spring-provide-args:
        - '@org.springframework.security.core.annotation.AuthenticationPrincipal com.jobstream.api.entity.User user'
      tags:
        - Job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRequestDto'
      responses:
        '201':
          description: Job saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
# ============================================================================
# COMPONENTS - Schemas & Responses
# ============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        firstName:
          type: string
          minLength: 1
          pattern: "^.*\\S.*$"
        lastName:
          type: string
          minLength: 1
          pattern: "^.*\\S.*$"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RoleDto:
      type: string
      enum:
        - USER
        - ADMIN
      example: USER

    AuthResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - role
      properties:
        accessToken:
          type: string
          description: Token JWT Bearer à transmettre dans le header Authorization
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          pattern: '^Bearer$'
          example: Bearer
        role:
          $ref: '#/components/schemas/RoleDto'

    JobRequestDto:
      type: object
      description: Job found via the external API (to be saved)
      required:
        - externalId
        - title
        - company
        - location
      properties:
        externalId:
          type: string
          description: External ID (Adzuna)
          example: "job_123456"
        title:
          type: string
          example: "Senior Java Developer"
        company:
          type: string
          example: "TechCorp France"
        location:
          type: string
          example: "Paris, France"
        description:
          type: string
          description: Full job description
          example: "We are looking for an experienced Java developer..."
        salaryMin:
          type: integer
          description: Minimum salary
          example: 50000
        salaryMax:
          type: integer
          description: Maximum salary
          example: 80000
        contractType:
          type: string
          description: Contract type
          example: "CDI"
        postedDate:
          type: string
          format: date
          description: Publication date
          example: "2026-03-20"
        jobUrl:
          type: string
          description: Original job URL
          example: "https://example.com/job/123"
        requirements:
          type: array
          items:
            type: string
          description: List of requirements
          example: ["Java 17", "Spring Boot", "PostgreSQL"]
    JobDto:
      description: Saved job
      allOf:
        - $ref: '#/components/schemas/JobRequestDto'
        - type: object
          properties:
            id:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time
              description: Creation date
            updatedAt:
              type: string
              format: date-time
              description: Last update
    PagedJobResponse:
      type: object
      description: Paginated response for saved jobs
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/JobDto'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    # ----------------------------------------------------------------------
    # Response DTOs
    # ----------------------------------------------------------------------
    JobOfferSearchResponse:
      type: object
      description: Provider-independent search results. Description text may be an excerpt.
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          description: Offers on the requested page, without local post-filtering.
          items:
            $ref: '#/components/schemas/JobDto'
        page:
          type: integer
          minimum: 1
          description: Requested page number, starting at 1, even for an empty page.
        size:
          type: integer
          minimum: 1
          maximum: 100
          description: Requested maximum number of results per page.
        totalElements:
          type: integer
          format: int64
          minimum: 0
          description: Total number of matching offers.
        totalPages:
          type: integer
          minimum: 0
          description: Total pages, computed by rounding totalElements / size up; 0 when no offers match.

    AdzunaJobSearchResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/JobDto'
        total:
          type: integer
          description: Total number of results
          example: 150
        count:
          type: integer
          description: Number of returned results
          example: 15

    # ----------------------------------------------------------------------
    # Error DTOs
    # ----------------------------------------------------------------------
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
          example: "Job not found"
        message:
          type: string
          example: "Job not found"
        date:
          type: string
          format: date-time

  # ----------------------------------------------------------------------
  # Responses
  # ----------------------------------------------------------------------
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            error: "Bad Request"
            message: "Invalid parameters"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            error: "Not Found"
            message: "Job not found"

    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            error: "Resource conflict"
            message: "Resource already exists"

    Unauthorized:
      description: Authentication is required or the provided token is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            error: "Unauthorized"
            message: "Authentication is required"

    Forbidden:
      description: The authenticated user is not allowed to access this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            error: "Forbidden"
            message: "Access denied"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 500
            error: "Internal Server Error"
            message: "An unexpected error occurred"
